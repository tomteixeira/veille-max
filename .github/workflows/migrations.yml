name: Database migrations

# Applies supabase/migrations to the hosted Supabase project once they reach main.
# The app itself is deployed by Vercel's Git integration, not by this workflow.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: supabase-migrations
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Apply migrations to hosted Supabase
    # Skipped until the hosted project is linked (README, "Deploy").
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only the Supabase CLI is needed, at the version pinned in package-lock.json.
      - run: npm ci --ignore-scripts

      - run: npx supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - run: npx supabase db push
