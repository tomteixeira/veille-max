<!--
  Sign-in email (Supabase "Magic Link" template). It carries the code only:
  no {{ .ConfirmationURL }}, because a link would open in Safari, outside the
  installed app. The hosted project needs the same subject and body (README).
-->
<!doctype html>
<html lang="fr">
  <body style="margin:0;padding:32px 16px;background:#f5f5f4;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1c1917;">
    <div style="max-width:420px;margin:0 auto;padding:28px 24px;background:#ffffff;border-radius:24px;">
      <p style="margin:0;font-size:13px;font-weight:600;color:#78716c;">Veille MAX</p>
      <h1 style="margin:8px 0 0;font-size:22px;line-height:1.2;font-weight:800;">Votre code de connexion</h1>
      <p style="margin:16px 0 0;font-size:15px;line-height:1.5;">Saisissez ce code dans l’application pour vous connecter.</p>
      <p style="margin:20px 0 0;font-size:34px;line-height:1;font-weight:800;letter-spacing:0.18em;color:#ea580c;">{{ .Token }}</p>
      <p style="margin:20px 0 0;font-size:13px;line-height:1.5;color:#78716c;">Il est valable une heure. Si vous n’avez pas demandé de code, ignorez cet e-mail.</p>
    </div>
    <p style="max-width:420px;margin:16px auto 0;font-size:11px;line-height:1.5;color:#78716c;">Veille MAX n’est pas affilié à SNCF Voyageurs ni à SNCF Connect.</p>
  </body>
</html>
